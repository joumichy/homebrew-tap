name: Test Homebrew formula

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Formula/fleury.rb"
      - ".github/workflows/test-formula.yml"
  push:
    branches:
      - main
    paths:
      - "Formula/fleury.rb"
      - ".github/workflows/test-formula.yml"

permissions:
  contents: read

jobs:
  test:
    name: Install Fleury with Homebrew
    runs-on: macos-14
    steps:
      - name: Check out the tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install and test the formula
        shell: bash
        run: |
          set -euo pipefail
          brew tap joumichy/tap "${GITHUB_WORKSPACE}"
          brew install joumichy/tap/fleury
          brew test joumichy/tap/fleury
          fleury version
