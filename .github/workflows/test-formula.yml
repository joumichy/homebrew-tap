name: Test Homebrew formula

on:
  pull_request:
    paths:
      - "Formula/fleury.rb"
  push:
    branches:
      - main
    paths:
      - "Formula/fleury.rb"

permissions:
  contents: read

jobs:
  test:
    name: Install Fleury with Homebrew
    runs-on: macos-14
    steps:
      - name: Check out the tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install and test the formula
        shell: bash
        run: |
          set -euo pipefail
          brew install --formula ./Formula/fleury.rb
          brew test ./Formula/fleury.rb
          fleury version
